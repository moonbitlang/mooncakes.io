name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  stable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          set -o pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon test
        run: |
          moon update
          moon install
          moon test --target js --serial --release
          moon test --target js --serial
          moon test --target native --serial
          moon test --target wasm --serial

      - name: moon check
        run: |
          moon check --target js --deny-warn
          moon check --target native --deny-warn
          moon check --target wasm --deny-warn

      - name: moon info
        run: |
          moon info --target js
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

  typo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.19.0
    steps:
      - uses: actions/checkout@v4

      - name: download typos
        run: |
          set -o pipefail
          install_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$install_dir"
          curl -LsSf "https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz" |
            tar zxf - -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: check typos
        run: typos
