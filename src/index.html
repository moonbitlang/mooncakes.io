<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!--
      Agent note:
      This app is a SPA. Documentation content is not available in index.html
      or static JS bundles. Use the API/assets instead of scraping rendered pages.
      
      For a package path `moonbitlang/core/bool`:

      `moonbitlang` is a user name
      `moonbitlang/core` is a module path
      `core` is the module relpath used as <mod-relpath> below
      `bool` is the package relpath used as <pkg-relpath> below

      Useful API endpoints/assets:

      - All modules
          GET /api/v0/modules

      - User profiles 
          GET /api/v0/user/<username>

      - Module metadata, including versions info
          GET /api/v0/manifest/<username>/<mod-relpath>

      - Public package assets root
          https://assets.mooncakes.io/assets

      - Module index, including packages, types and values list
          GET <assets-root>/<username>/<mod-relpath>@<version>/module_index.json

      - Package docs, including README and API
          GET <assets-root>/<username>/<mod-relpath>@<version>/<pkg-relpath>/resources.json
          GET <assets-root>/<username>/<mod-relpath>@<version>/<pkg-relpath>/package_data.json

      - Download source manually:
          https://download.mooncakes.io/user/<username>/<mod-relpath>/<version>.zip

      
      Prefer `moon ide` if the MoonBit toolchain is available.
      -->
    <title>mooncakes.io</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" type="text/css" href="/styles.css" />
    <!--
      Theme FOUC guard. Keep in sync with apply_document_theme in src/main/main.mbt:
      localStorage key "mooncakes-theme", values "system" | "light" | "dark",
      missing/invalid => system; also set class, color-scheme, and backgroundColor.
    -->
    <script>
      (function () {
        var key = 'mooncakes-theme';
        var pref = 'system';
        try {
          var stored = window.localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            pref = stored;
          }
        } catch (_) {}
        var systemDark = false;
        try {
          systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (_) {}
        var resolved =
          pref === 'dark' || (pref === 'system' && systemDark) ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.add(
          resolved === 'dark' ? 'theme-dark' : 'theme-light',
          'theme-pref-' + pref
        );
        root.style.colorScheme = resolved;
        if (resolved === 'dark') {
          root.style.backgroundColor = '#0b0b0c';
        } else {
          root.style.backgroundColor = '#fafafa';
        }
      })();
    </script>
    <script src="/main.js" type="module"></script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
